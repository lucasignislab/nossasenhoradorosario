function redimensionarImagem(file, maxLado = 900, qualidade = 0.7) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > height && width > maxLado) {
                    height = Math.round(height * (maxLado / width));
                    width = maxLado;
                }
                else if (height > maxLado) {
                    width = Math.round(width * (maxLado / height));
                    height = maxLado;
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", qualidade));
            };
            img.onerror = reject;
            img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}
// Redimensiona a imagem e já manda pro Storage do Supabase, devolvendo
// o link (bem mais leve que guardar a foto inteira dentro do banco).
async function redimensionarEUpload(file, pasta) {
    const dataUrl = await redimensionarImagem(file);
    const blob = await (await fetch(dataUrl)).blob();
    const caminho = `${pasta}/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
    const { error } = await supabase.storage.from("fotos").upload(caminho, blob, { contentType: "image/jpeg" });
    if (error)
        throw error;
    const { data } = supabase.storage.from("fotos").getPublicUrl(caminho);
    return data.publicUrl;
}
// Sobe um PDF (ou outro arquivo) direto, sem redimensionar — usado em
// Pontos Cantados e Regras da Casa.
async function uploadDocumento(file, pasta) {
    const nomeSeguro = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const caminho = `${pasta}/${Date.now()}-${nomeSeguro}`;
    const { error } = await supabase.storage.from("documentos").upload(caminho, file, { contentType: file.type || "application/pdf" });
    if (error)
        throw error;
    const { data } = supabase.storage.from("documentos").getPublicUrl(caminho);
    return data.publicUrl;
}

function carregarJsPdf() {

        return Promise.resolve(window.jspdf.jsPDF);
    if (window.__jspdfPromise)

        const s = document.createElement("script");
        s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
        s.onload = () => {
            if (window.jspdf && window.jspdf.jsPDF) {
                resolve(window.jspdf.jsPDF);
            }
            else {
                window.__jspdfPromise = null;
                reject(new Error("A biblioteca de PDF não carregou direito."));
            }

            window.__jspdfPromise = null; // deixa tentar de novo depois

// Liga ou desliga um recurso opcional de um terreiro (Carteirinha, Cantina) e CONFERE se o banco gravou de verdade.
async function alternarRecursoTerreiro(cliente, inst, coluna) {
    const novoValor = !inst[coluna];
    const { data, error } = await cliente.from("terreiros").update({ [coluna]: novoValor }).eq("id", inst.id).select("id");
    if (error) {
        const faltaColuna = /does not exist|could not find|schema cache/i.test(error.message || "");
        const arquivo = coluna === "cantina_ativa" ? "cantina.sql" : "o SQL da Carteirinha";
        return { ok: false, mensagem: faltaColuna ? `esse recurso ainda não foi instalado no banco. Rode ${arquivo} no Supabase (SQL Editor) e tente de novo.` : "não foi possível alterar. " + (error.message || "Erro desconhecido.") };
    }
    if (!data || data.length === 0) {
        return { ok: false, mensagem: "o banco não deixou alterar este terreiro (sem permissão). Entre com o login do dono do sistema e tente de novo." };
    }
    return { ok: true, novoValor };
}
